<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>流水线大变量七层防护体系</title>
  <style>
    html,
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      background: #eef5ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    svg {
      display: block;
      width: 1920px;
      height: 1080px;
    }

    .title {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -1px;
      fill: #0f2f72;
    }

    .subtitle {
      font-size: 24px;
      fill: #49627f;
    }

    .layer-no {
      font-size: 22px;
      font-weight: 900;
      fill: #ffffff;
    }

    .layer-title {
      font-size: 25px;
      font-weight: 900;
      fill: #123b86;
    }

    .layer-desc {
      font-size: 18px;
      fill: #44566c;
    }

    .layer-key {
      font-size: 17px;
      font-weight: 800;
      fill: #1769ff;
    }

    .footer-title {
      font-size: 25px;
      font-weight: 900;
      fill: #ffffff;
    }

    .footer-text {
      font-size: 18px;
      fill: rgba(255,255,255,.86);
    }
  </style>
</head>
<body>
<svg viewBox="0 0 1920 1080" role="img" aria-label="流水线大变量七层防护体系">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="0.55" stop-color="#edf5ff" />
      <stop offset="1" stop-color="#e7efff" />
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1769ff" />
      <stop offset="1" stop-color="#00a6c8" />
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b4d" />
      <stop offset="0.55" stop-color="#0b3f9f" />
      <stop offset="1" stop-color="#1769ff" />
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="card5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1769ff" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#6b8fc9"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1650" cy="120" r="260" fill="#dbeafe" opacity="0.48"/>
  <circle cx="260" cy="930" r="300" fill="#c7d2fe" opacity="0.35"/>
  <path d="M0 190 C260 130 400 230 650 172 C900 115 1110 120 1390 182 C1610 232 1760 180 1920 130 L1920 0 L0 0Z" fill="#ffffff" opacity="0.62"/>

  <g transform="translate(120 72)">
    <rect x="0" y="0" width="1680" height="140" rx="34" fill="#ffffff" opacity="0.88" filter="url(#shadow)"/>
    <rect x="24" y="31" width="78" height="78" rx="24" fill="url(#blue)"/>
    <path d="M63 48 L88 60 L88 82 C88 100 75 111 63 116 C51 111 38 100 38 82 L38 60 Z" fill="#ffffff" opacity="0.96"/>
    <path d="M52 80 L60 88 L76 68" fill="none" stroke="#1769ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="61" class="title">流水线大变量七层防护体系</text>
    <text x="126" y="102" class="subtitle">入口硬上限、写入引用化、读取懒加载、缓存预算与迁移流式处理，构建从运行到归档全链路稳定</text>
    <rect x="1412" y="38" width="212" height="64" rx="32" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="1518" y="78" text-anchor="middle" font-size="25" font-weight="900" fill="#1769ff">&gt;4K / ≤4M</text>
  </g>

  <g opacity="0.7">
    <path d="M320 438 C470 330 575 330 725 438" fill="none" stroke="#a8c4ee" stroke-width="4" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
    <path d="M725 438 C875 330 980 330 1130 438" fill="none" stroke="#a8c4ee" stroke-width="4" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
    <path d="M1130 438 C1280 330 1385 330 1535 438" fill="none" stroke="#a8c4ee" stroke-width="4" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
    <path d="M1535 632 C1385 740 1280 740 1130 632" fill="none" stroke="#a8c4ee" stroke-width="4" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
    <path d="M1130 632 C980 740 875 740 725 632" fill="none" stroke="#a8c4ee" stroke-width="4" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
    <path d="M725 632 C575 740 470 740 320 632" fill="none" stroke="#a8c4ee" stroke-width="4" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(120 275)" filter="url(#shadow)">
    <rect width="360" height="224" rx="30" fill="url(#card1)" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="52" cy="52" r="34" fill="url(#blue)"/>
    <text x="52" y="60" text-anchor="middle" class="layer-no">1</text>
    <text x="104" y="54" class="layer-title">入口硬限制</text>
    <text x="34" y="112" class="layer-desc">Worker 上传变量先做</text>
    <text x="34" y="142" class="layer-key">单值 4M 硬上限</text>
    <text x="34" y="174" class="layer-desc">超限直接拒绝 / 丢弃</text>
    <path d="M292 42 L318 42 L318 76 L292 76 Z M298 36 L312 36 L312 42 L298 42 Z" fill="#1769ff" opacity="0.82"/>
  </g>

  <g transform="translate(526 275)" filter="url(#shadow)">
    <rect width="360" height="224" rx="30" fill="url(#card2)" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="52" cy="52" r="34" fill="#7c3aed"/>
    <text x="52" y="60" text-anchor="middle" class="layer-no">2</text>
    <text x="104" y="54" class="layer-title">服务端写入校验</text>
    <text x="34" y="112" class="layer-desc">写入前二次确认长度</text>
    <text x="34" y="142" class="layer-key">4M 校验 + 安全丢弃</text>
    <text x="34" y="174" class="layer-desc">避免异常大值进库</text>
    <path d="M294 40 C318 52 318 78 294 90 C270 78 270 52 294 40Z" fill="#7c3aed" opacity="0.82"/>
    <path d="M282 65 L291 75 L309 55" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(932 275)" filter="url(#shadow)">
    <rect width="360" height="224" rx="30" fill="url(#card3)" stroke="#86efac" stroke-width="2"/>
    <circle cx="52" cy="52" r="34" fill="#1f9d55"/>
    <text x="52" y="60" text-anchor="middle" class="layer-no">3</text>
    <text x="104" y="54" class="layer-title">主表短引用</text>
    <text x="34" y="112" class="layer-desc">真实值进入溢出表</text>
    <text x="34" y="142" class="layer-key">主表仅存 ≤25 字符引用</text>
    <text x="34" y="174" class="layer-desc">列表读取天然轻量</text>
    <rect x="274" y="40" width="44" height="58" rx="8" fill="#1f9d55" opacity="0.82"/>
    <path d="M284 57 H308 M284 72 H308 M284 87 H298" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(1338 275)" filter="url(#shadow)">
    <rect width="360" height="224" rx="30" fill="url(#card4)" stroke="#fdba74" stroke-width="2"/>
    <circle cx="52" cy="52" r="34" fill="#f59e0b"/>
    <text x="52" y="60" text-anchor="middle" class="layer-no">4</text>
    <text x="104" y="54" class="layer-title">节点本地缓存</text>
    <text x="34" y="112" class="layer-desc">表达式节点按需读取</text>
    <text x="34" y="142" class="layer-key">命中后本地复用</text>
    <text x="34" y="174" class="layer-desc">减少重复 DB 拉取</text>
    <path d="M278 50 H318 V88 H278 Z" fill="#f59e0b" opacity="0.82"/>
    <path d="M278 62 H318 M290 50 V88 M306 50 V88" stroke="#fff" stroke-width="4" opacity="0.9"/>
  </g>

  <g transform="translate(120 598)" filter="url(#shadow)">
    <rect width="360" height="224" rx="30" fill="url(#card5)" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="52" cy="52" r="34" fill="#8b5cf6"/>
    <text x="52" y="60" text-anchor="middle" class="layer-no">5</text>
    <text x="104" y="54" class="layer-title">会话级 LRU</text>
    <text x="34" y="112" class="layer-desc">同一会话共享缓存</text>
    <text x="34" y="142" class="layer-key">8M LRU 淘汰</text>
    <text x="34" y="174" class="layer-desc">兼顾命中率与内存</text>
    <path d="M274 52 C274 40 318 40 318 52 V84 C318 96 274 96 274 84Z" fill="#8b5cf6" opacity="0.82"/>
    <path d="M274 52 C274 64 318 64 318 52 M274 68 C274 80 318 80 318 68" fill="none" stroke="#fff" stroke-width="4"/>
  </g>

  <g transform="translate(526 598)" filter="url(#shadow)">
    <rect width="360" height="224" rx="30" fill="url(#card1)" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="52" cy="52" r="34" fill="#0ea5e9"/>
    <text x="52" y="60" text-anchor="middle" class="layer-no">6</text>
    <text x="104" y="54" class="layer-title">总字节预算</text>
    <text x="34" y="112" class="layer-desc">单次会话设置预算阈值</text>
    <text x="34" y="142" class="layer-key">32M 总量保护</text>
    <text x="34" y="174" class="layer-desc">超预算降级为引用串</text>
    <path d="M274 88 A44 44 0 1 1 318 88" fill="none" stroke="#0ea5e9" stroke-width="12" opacity="0.82"/>
    <path d="M296 88 L312 62" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(932 598)" filter="url(#shadow)">
    <rect width="766" height="224" rx="30" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="52" cy="52" r="34" fill="url(#blue)"/>
    <text x="52" y="60" text-anchor="middle" class="layer-no">7</text>
    <text x="104" y="54" class="layer-title">迁移按 Build 单条流式处理</text>
    <text x="34" y="112" class="layer-desc">归档 / 清理不批量装载大 mediumtext</text>
    <text x="34" y="142" class="layer-key">按 buildId 流式迁移，失败快速回滚</text>
    <text x="34" y="174" class="layer-desc">保障历史查询、启动参数 replay 与大变量真实值完整闭环</text>
    <g transform="translate(626 46)">
      <rect x="0" y="0" width="72" height="38" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="30" y="56" width="72" height="38" rx="10" fill="#dcfce7" stroke="#22c55e"/>
      <path d="M72 20 C116 20 116 75 104 75" fill="none" stroke="#1769ff" stroke-width="6" marker-end="url(#arrow)"/>
    </g>
  </g>

  <g transform="translate(120 880)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1680" height="112" rx="34" fill="url(#deep)"/>
    <text x="52" y="44" class="footer-title">防护闭环</text>
    <text x="52" y="78" class="footer-text">入口限制 → 写入引用化 → 主路径轻量读取 → 表达式按需加载 → 缓存复用 → 预算降级 → 归档流式迁移</text>
    <rect x="1330" y="28" width="288" height="56" rx="28" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.28)"/>
    <text x="1474" y="64" text-anchor="middle" font-size="21" font-weight="900" fill="#ffffff">稳定性 / 性能 / 可运维</text>
  </g>
</svg>
</body>
</html>
